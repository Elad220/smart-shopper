name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          frontend:
            - 'frontend/**'
          backend:
            - 'backend/**'

  pr-lint:
    name: PR Lint Check
    runs-on: ubuntu-latest
    needs: changes
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install and lint frontend
      if: needs.changes.outputs.frontend == 'true'
      working-directory: ./frontend
      run: |
        npm ci
        npm run lint

    - name: Install and lint backend
      if: needs.changes.outputs.backend == 'true'
      working-directory: ./backend
      run: |
        npm ci
        npm run lint || echo "Backend linting not configured"

  pr-test:
    name: PR Tests
    runs-on: ubuntu-latest
    needs: changes
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Test frontend
      if: needs.changes.outputs.frontend == 'true'
      working-directory: ./frontend
      run: |
        npm ci
        npm run test:ci

    - name: Test backend
      if: needs.changes.outputs.backend == 'true'
      working-directory: ./backend
      run: |
        npm ci
        echo "NODE_ENV=test" >> .env
        echo "MONGODB_URI=mongodb://localhost:27017/smart-shopper-test" >> .env
        echo "JWT_SECRET=test-jwt-secret" >> .env
        echo "PORT=3001" >> .env
        npm run test:ci

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run npm audit on frontend
      if: needs.changes.outputs.frontend == 'true'
      working-directory: ./frontend
      run: npm audit --audit-level=moderate || true

    - name: Run npm audit on backend
      if: needs.changes.outputs.backend == 'true'
      working-directory: ./backend
      run: npm audit --audit-level=moderate || true

  pr-build:
    name: PR Build Check
    runs-on: ubuntu-latest
    needs: [pr-lint, pr-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

  pr-summary:
    name: PR Check Summary
    runs-on: ubuntu-latest
    needs: [pr-lint, pr-test, security-scan, pr-build]
    if: always()
    
    steps:
    - name: PR Status Summary
      run: |
        echo "## Pull Request Check Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint | ${{ needs.pr-lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.pr-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ${{ needs.pr-build.result }} |" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.pr-lint.result }}" != "success" ] || 
           [ "${{ needs.pr-test.result }}" != "success" ] || 
           [ "${{ needs.pr-build.result }}" != "success" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ Some checks failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
        fi