name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
  push:
    branches:
      - main

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.smart-shopper.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
      env:
        VITE_API_URL: ${{ secrets.STAGING_API_URL }}
        VITE_ENVIRONMENT: staging

    - name: Deploy frontend to staging
      run: |
        echo "Deploying frontend to staging..."
        # Add your deployment commands here
        # Example: aws s3 sync ./frontend/dist s3://staging-bucket
        # Example: scp -r ./frontend/dist/* user@staging-server:/var/www/html

    - name: Deploy backend to staging
      run: |
        echo "Deploying backend to staging..."
        # Add your deployment commands here
        # Example: ssh user@staging-server 'cd /app && git pull && npm install && pm2 restart api'

    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://smart-shopper.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Build frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
      env:
        VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        VITE_ENVIRONMENT: production
        NODE_ENV: production

    - name: Build Docker images
      run: |
        docker build -t smart-shopper-frontend:latest ./frontend
        docker build -t smart-shopper-backend:latest ./backend

    - name: Push to container registry
      run: |
        echo "Pushing Docker images to registry..."
        # Add your container registry push commands here
        # Example:
        # echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        # docker push smart-shopper-frontend:latest
        # docker push smart-shopper-backend:latest

    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Add your production deployment commands here
        # Example: kubectl set image deployment/frontend frontend=smart-shopper-frontend:latest
        # Example: kubectl set image deployment/backend backend=smart-shopper-backend:latest

    - name: Run health checks
      run: |
        echo "Running production health checks..."
        # Add health check commands here
        # Example: curl -f https://smart-shopper.example.com/health || exit 1

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Production deployment successful!"
          # Add notification commands (Slack, email, etc.)
        else
          echo "❌ Production deployment failed!"
          # Add alert commands
        fi